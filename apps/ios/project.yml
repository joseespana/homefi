# Xcode project for the iPhone app, generated with XcodeGen:
#   cd apps/ios && xcodegen
# HomeFi.xcodeproj is not committed; this file is the source of truth.
name: HomeFi
options:
  bundleIdPrefix: com.perseusoft
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Xcode → Signing & Capabilities: pick your (Personal) Team once.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # the Rust core is built for arm64 only (Apple silicon simulators and iPhones)
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  HomeFi:
    type: application
    platform: iOS
    sources:
      - path: HomeFi
      - path: Core/HomefiCore.swift
    dependencies:
      # builds the Rust core first, so the framework below is fresh
      - target: HomefiCore
      - framework: Core/HomefiCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - sdk: Security.framework
    info:
      path: HomeFi/Info.plist
      properties:
        CFBundleDisplayName: HomeFi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, es]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # keep playing with the screen off
        UIBackgroundModes: [audio]
        # Finder (iPhone → Files → HomeFi) and the Files app can drop music in
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perseusoft.homefi
        PRODUCT_NAME: HomeFi
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
aggregateTargets:
  # The Rust core (homefi-ffi) as a static XCFramework + Swift bindings.
  HomefiCore:
    buildScripts:
      - name: Build HomeFi core (Rust)
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then P=release; else P=debug; fi
          # a clean environment: Xcode's SDK variables confuse cargo's C builds
          /usr/bin/env -i HOME="$HOME" PATH="$HOME/.cargo/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            "$SRCROOT/scripts/build-core.sh" "$P"
        basedOnDependencyAnalysis: false
