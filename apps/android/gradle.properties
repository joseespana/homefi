org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Rust build integration (see app/build.gradle.kts):
#   homefi.abis      ABIs compiled by cargo-ndk (comma separated)
#   homefi.skipRust  true = use prebuilt jniLibs + bindings (CI)
#   homefi.ndkVersion NDK used by cargo-ndk (installed through the SDK manager)
homefi.abis=arm64-v8a,armeabi-v7a,x86_64
homefi.ndkVersion=29.0.14206865
