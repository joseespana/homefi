<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{TITLE}}</title>
<style>
  /* One renderer for the TV: a browser on the LAN, the desktop's TV window and Android TV's WebView.
     Always dark. The layout is a 16:9 stage measured in rem, where 1rem = 10 vh (or 17.78 vw on a narrower
     window), so it is the same at any resolution and letterboxed on any other shape. At 1080p, 0.44rem = 44 px:
     the key text is never smaller. No filters, no blur, no per-frame layout: the beat only moves opacity and
     transform. Colours: --k is the part's zone colour, --z the tint now (the interval's work / rest colour). */
  html { font-size: calc(min(1vh, 0.5625vw) * 10); background: #04060a; }
  body { margin: 0; height: 100vh; overflow: hidden; color: #f4f7fb; cursor: none; background: #04060a;
    font-family: "SF Pro Display", "Helvetica Neue", Helvetica, Arial, "Segoe UI", Roboto, sans-serif;
    --k: #4f8cff; --z: #4f8cff; --kr: 79,140,255; --zr: 79,140,255; }
  .amb { position: fixed; left: 0; top: 0; right: 0; bottom: 0; opacity: 0; transition: opacity 0.9s ease; }
  .amb.on { opacity: 1; }
  #vignette { position: fixed; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none;
    background: radial-gradient(ellipse 90% 80% at 50% 45%, rgba(4,6,10,0) 55%, rgba(4,6,10,0.7) 100%); }
  #stage { position: absolute; left: 50%; top: 50%; width: 17.778rem; height: 10rem; margin-left: -8.889rem;
    margin-top: -5rem; transition: opacity 0.3s; font-variant-numeric: tabular-nums; }
  body[data-paused="1"] #stage { opacity: 0.28; }
  .abs { position: absolute; }
  .r, .d, .w, .c { visibility: hidden; }
  body[data-mode="ride"] .r, body[data-mode="ride"] .c, body[data-mode="done"] .d, body[data-mode="done"] .c,
  body[data-mode="wait"] .w { visibility: visible; }
  .glass { border-radius: 0.34rem; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box;
    background: linear-gradient(165deg, rgba(255,255,255,0.085), rgba(255,255,255,0.03) 60%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0.6rem 1.6rem rgba(0,0,0,0.38); }
  .cap { font-size: 0.4rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #9fb0c6; }

  /* header */
  #title { left: 0.7rem; top: 0.34rem; height: 0.5rem; display: flex; align-items: center; font-size: 0.36rem;
    font-weight: 700; letter-spacing: 0.06em; color: #9fb0c6; white-space: nowrap; }
  #titleText { display: block; max-width: 7rem; overflow: hidden; text-overflow: ellipsis; }
  #mark { width: 0.26rem; height: 0.26rem; border-radius: 50%; margin-right: 0.18rem; flex: none; background: var(--k);
    box-shadow: 0 0 0.26rem var(--k), inset 0 0.03rem 0.05rem rgba(255,255,255,0.7); transition: background 0.6s; }
  #clock { right: 1.1rem; top: 0.34rem; height: 0.5rem; display: flex; align-items: center; font-size: 0.4rem;
    font-weight: 700; color: #9fb0c6; letter-spacing: 0.02em; }
  #clock b { color: #f4f7fb; font-weight: 700; }
  #link { right: 0.7rem; top: 0.49rem; width: 0.17rem; height: 0.17rem; border-radius: 50%; background: #8f2f2f; }

  /* left: the part, how to ride it and how hard */
  #now { left: 0.7rem; top: 1.1rem; width: 5.4rem; height: 5.35rem; padding: 0.4rem 0.4rem 0.38rem;
    transition: transform 0.6s cubic-bezier(.3,.8,.3,1), width 0.6s cubic-bezier(.3,.8,.3,1);
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
  #now::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 0.07rem;
    background: linear-gradient(90deg, var(--k), rgba(var(--kr),0) 90%); }
  #segment { font-size: 0.86rem; font-weight: 800; line-height: 1.02; letter-spacing: -0.01em; color: var(--k);
    transition: color 0.6s; }
  #segment.s1 { font-size: 0.72rem; }
  #segment.s2 { font-size: 0.62rem; }
  #segment.s3 { font-size: 0.54rem; }
  #position { margin-top: 0.22rem; display: inline-flex; align-items: center; align-self: flex-start;
    font-size: 0.46rem; font-weight: 700; line-height: 1.1; padding: 0.1rem 0.28rem 0.1rem 0.16rem;
    border-radius: 0.4rem; background: rgba(255,255,255,0.09); color: #cfe3ff; }
  #position svg { width: 0.5rem; height: 0.5rem; margin-right: 0.12rem; flex: none; fill: none; stroke: currentColor;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  #pipsCap { margin-bottom: 0.14rem; }
  #pips { display: flex; align-items: flex-end; height: 0.3rem; }
  #pips i { display: block; flex: 1; margin-right: 0.05rem; height: 0.12rem; border-radius: 0.06rem; background: var(--p);
    opacity: 0.3; }
  #pips i:last-child { margin-right: 0; }
  #pips i.done { opacity: 0.55; }
  #pips i.cur { height: 0.3rem; opacity: 1; box-shadow: 0 0 0.2rem var(--p); }
  #effortHead { display: flex; align-items: baseline; justify-content: space-between; }
  #effortWord { font-size: 0.5rem; font-weight: 800; letter-spacing: 0.01em; }
  #effortNum { font-size: 0.62rem; font-weight: 800; color: var(--k); transition: color 0.6s; }
  #effortNum small { font-size: 0.4rem; font-weight: 700; color: #9fb0c6; margin-left: 0.04rem; }
  #bars { display: flex; align-items: flex-end; justify-content: space-between; height: 0.62rem; margin-top: 0.14rem; }
  #bars i { display: block; width: 0.37rem; border-radius: 0.09rem; background: rgba(255,255,255,0.12);
    transition: background 0.5s; }

  /* right: the clock of this part, and what is next */
  #timerCard { right: 0.7rem; top: 1.1rem; width: 5.4rem; height: 3.05rem; padding: 0.34rem 0.4rem 0;
    overflow: hidden; transition: transform 0.6s cubic-bezier(.3,.8,.3,1), width 0.6s cubic-bezier(.3,.8,.3,1); }
  #timer { font-size: 1.4rem; font-weight: 800; line-height: 1; letter-spacing: -0.015em; white-space: nowrap; }
  #round { margin-top: 0.14rem; font-size: 0.44rem; font-weight: 600; color: #b6c4d8; line-height: 1.12; }
  #segBar { margin-top: 0.2rem; height: 0.14rem; border-radius: 0.1rem;
    background: rgba(255,255,255,0.12); overflow: hidden; }
  #segFill { height: 100%; width: 0; border-radius: 0.1rem; background: var(--k); transition: background 0.6s; }
  #dots { margin-top: 0.2rem; height: 0.14rem; display: flex; align-items: center; }
  #dots i { display: block; flex: 1; max-width: 0.6rem; height: 0.14rem; margin-right: 0.08rem; border-radius: 0.1rem;
    background: rgba(255,255,255,0.14); }
  #dots i.done { background: var(--z); opacity: 0.5; }
  #dots i.cur { background: var(--z); box-shadow: 0 0 0.2rem var(--z); }
  #nextCard { right: 0.7rem; top: 4.3rem; width: 5.4rem; height: 2.15rem; padding: 0.24rem 0.4rem 0 0.5rem;
    overflow: hidden; opacity: 0.88; transition: opacity 0.4s, box-shadow 0.4s, transform 0.6s cubic-bezier(.3,.8,.3,1),
    width 0.6s cubic-bezier(.3,.8,.3,1), top 0.6s cubic-bezier(.3,.8,.3,1); }
  #nextCard::before { content: ""; position: absolute; left: 0; top: 0.22rem; bottom: 0.22rem; width: 0.09rem;
    border-radius: 0 0.1rem 0.1rem 0; background: var(--n, #4f8cff); }
  #nextCard.soon { opacity: 1; box-shadow: 0 0 0 0.04rem var(--n), 0 0 0.9rem rgba(var(--nr),0.35); }
  #nextName { margin-top: 0.1rem; font-size: 0.62rem; font-weight: 800; line-height: 1.04; color: var(--n); }
  #nextName.s1 { font-size: 0.54rem; }
  #nextName.s2 { font-size: 0.47rem; }
  #nextSub { margin-top: 0.1rem; font-size: 0.44rem; font-weight: 600; color: #cfdcec; }

  /* centre: the cadence gauge */
  #phase { left: 5.9rem; width: 6rem; top: 0.25rem; text-align: center; }
  #phase span { display: inline-block; font-size: 0.56rem; font-weight: 900; letter-spacing: 0.14em; line-height: 0.74rem;
    padding: 0 0.5rem 0 0.62rem; border-radius: 0.5rem; color: #05070a; background: var(--z); transition: background 0.4s;
    box-shadow: 0 0 0.9rem rgba(var(--zr),0.55); }
  #center { left: 6.239rem; top: 1.15rem; width: 5.3rem; height: 5.3rem; transition: transform 0.6s cubic-bezier(.3,.8,.3,1); }
  #aura { position: absolute; left: -12%; top: -12%; width: 124%; height: 124%; opacity: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(var(--zr),0.42) 0%, rgba(var(--zr),0.14) 45%, rgba(var(--zr),0) 68%); }
  #dial { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  #dial .rot { transform-origin: 200px 200px; }
  #dial .band, #dial .knobG { transition: transform 0.7s cubic-bezier(.3,.8,.3,1), stroke-dasharray 0.7s cubic-bezier(.3,.8,.3,1),
    stroke 0.5s; }
  #dial .halo { transform-origin: 200px 200px; opacity: 0; }
  #readout { position: absolute; left: 0; right: 0; top: 0; bottom: 0; text-align: center; }
  #rpm { position: absolute; left: 0; right: 0; top: 20%; font-size: 2.15rem; font-weight: 900; line-height: 1;
    letter-spacing: -0.03em; white-space: nowrap; color: #fff; text-shadow: 0 0 0.5rem rgba(var(--zr),0.6);
    will-change: transform; }
  #rpm.three { font-size: 1.7rem; top: 22%; }
  #unit { position: absolute; left: 0; right: 0; top: 63%; font-size: 0.46rem; font-weight: 800; letter-spacing: 0.3em;
    color: var(--z); transition: color 0.4s; padding-left: 0.3em; }
  #range { position: absolute; left: 0; right: 0; top: 79%; text-align: center; font-size: 0; }
  #rangeText { display: inline-block; min-width: 1.6rem; padding: 0 0.26rem; height: 0.62rem; line-height: 0.62rem;
    font-size: 0.5rem; font-weight: 800; white-space: nowrap; border-radius: 0.4rem; background: rgba(255,255,255,0.1); color: #fff; }
  #pbar { position: absolute; left: 50%; margin-left: -1.1rem; width: 2.2rem; top: 93%; height: 0.14rem; border-radius: 0.1rem;
    background: rgba(255,255,255,0.14); display: none; overflow: hidden; }
  #pbarFill { height: 100%; width: 0; background: var(--z); }
  #flash { position: fixed; left: 0; top: 0; right: 0; bottom: 0; opacity: 0; pointer-events: none; }

  /* bottom: the course */
  #panel { left: 0.7rem; width: 16.378rem; top: 6.65rem; height: 3.1rem; transition: top 0.6s cubic-bezier(.3,.8,.3,1), height 0.6s cubic-bezier(.3,.8,.3,1); overflow: hidden; }
  /* the course is one canvas inside the panel (drawn at a fixed design size and scaled: see drawCourse) */
  #course { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

  /* states */
  #waitMark { left: 7.389rem; top: 1.7rem; width: 3rem; height: 3rem; }
  #waitMark i { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%; border: 0.05rem solid #4f8cff;
    animation: ripple 3.2s ease-out infinite; opacity: 0; }
  #waitMark i:nth-child(2) { animation-delay: 1.07s; }
  #waitMark i:nth-child(3) { animation-delay: 2.13s; }
  #waitMark b { position: absolute; left: 0.8rem; top: 0.8rem; width: 1.4rem; height: 1.4rem; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #4f8cff 55%, #1d3f87); box-shadow: 0 0 1.4rem rgba(79,140,255,0.7); }
  @keyframes ripple { 0% { transform: scale(0.45); opacity: 0.8; } 100% { transform: scale(1.35); opacity: 0; } }
  #brand { left: 0; width: 17.778rem; top: 5.05rem; text-align: center; font-size: 0.8rem; font-weight: 900;
    letter-spacing: 0.04em; }
  #waitMsg { left: 0; width: 17.778rem; top: 6.1rem; text-align: center; font-size: 0.56rem; font-weight: 700; color: #b6c4d8; }
  #url { left: 0; width: 17.778rem; top: 7.2rem; text-align: center; }
  #url span { display: inline-block; font-size: 0.46rem; font-weight: 700; color: #9fb0c6; padding: 0.1rem 0.4rem;
    border-radius: 0.4rem; background: rgba(255,255,255,0.08); }

  #done { left: 2.389rem; width: 13rem; top: 1.1rem; height: 5.35rem; text-align: center; padding-top: 0.22rem; }
  #doneBadge { width: 0.62rem; height: 0.62rem; margin: 0 auto; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8ff0b4, #2fbf71); box-shadow: 0 0 1rem rgba(74,222,128,0.5); }
  #doneBadge svg { display: block; width: 100%; height: 100%; fill: none; stroke: #04210f; stroke-width: 2.6; stroke-linecap: round;
    stroke-linejoin: round; }
  #doneTitle { margin-top: 0.1rem; font-size: 0.64rem; font-weight: 900; letter-spacing: -0.01em; }
  #doneNice { margin-top: 0.02rem; font-size: 0.46rem; font-weight: 700; color: #b6c4d8; }
  #stats { margin: 0.14rem auto 0; display: flex; justify-content: center; }
  .stat { margin: 0 0.3rem; min-width: 2rem; }
  .stat b { display: block; font-size: 0.62rem; font-weight: 800; line-height: 1; }
  .stat span { display: block; margin-top: 0.06rem; font-size: 0.4rem; font-weight: 700; color: #9fb0c6; }
  #mix { margin: 0.2rem 0.6rem 0; height: 0.2rem; border-radius: 0.12rem; overflow: hidden; display: flex; }
  #mix i { display: block; height: 100%; }
  #legend { margin: 0.14rem 0.3rem 0; display: flex; flex-wrap: wrap; justify-content: center; }
  #legend span { margin: 0.03rem 0.14rem; font-size: 0.35rem; font-weight: 700; color: #cfdcec; white-space: nowrap; }
  #legend i { display: inline-block; width: 0.18rem; height: 0.18rem; border-radius: 50%; margin-right: 0.08rem; }

  #count { position: fixed; z-index: 8; left: 0; top: 0; right: 0; bottom: 0; display: none; background: rgba(4,6,10,0.93); }
  #countBox { position: absolute; left: 50%; top: 50%; width: 17.778rem; height: 10rem; margin-left: -8.889rem; margin-top: -5rem;
    text-align: center; }
  #countDigit { position: absolute; left: 0; right: 0; top: 0.9rem; font-size: 4.4rem; font-weight: 900; line-height: 1;
    color: var(--c, #fff); text-shadow: 0 0 1.4rem rgba(var(--cr),0.55); animation: digit 1s ease-out both; }
  @keyframes digit { 0% { transform: scale(1.35); opacity: 0; } 22% { transform: scale(1); opacity: 1; }
    100% { transform: scale(0.92); opacity: 0.85; } }
  #countName { position: absolute; left: 0; right: 0; top: 6.0rem; font-size: 0.84rem; font-weight: 800; }
  #countRpm { position: absolute; left: 0; right: 0; top: 7.1rem; font-size: 0.56rem; font-weight: 700; color: #cfdcec; }
  #pausedMsg { position: fixed; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; align-items: center;
    padding: 0.3rem 0.8rem 0.3rem 0.6rem; font-size: 1rem; font-weight: 800; border-radius: 1rem;
    background: rgba(18,25,36,0.92); border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 1rem 3rem rgba(0,0,0,0.6); }
  #pausedMsg i { display: block; width: 0.18rem; height: 0.6rem; margin-right: 0.12rem; border-radius: 0.05rem; background: #fff; }
  #pausedMsg i:nth-child(2) { margin-right: 0.4rem; }
  #reconnect { position: fixed; left: 50%; top: 0.25rem; transform: translateX(-50%); display: none; align-items: center;
    font-size: 0.46rem; font-weight: 700; padding: 0.08rem 0.4rem 0.08rem 0.3rem; border-radius: 0.5rem;
    background: rgba(91,29,29,0.95); color: #ffd6d6; border: 1px solid rgba(255,140,140,0.4); z-index: 9; }
  #reconnect i { display: block; width: 0.22rem; height: 0.22rem; margin-right: 0.16rem; border-radius: 50%;
    border: 0.05rem solid rgba(255,214,214,0.35); border-top-color: #ffd6d6; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* lyrics: with lyrics on, the top row shrinks to 0.85 (cards keep their 5.4rem width: they are drawn 6.35rem wide and
     scaled) and the course drops, so a band with the song fits between them without hiding anything */
  #lyr { left: 0.7rem; top: 5.8rem; width: 16.378rem; height: 1.65rem; padding: 0 0.5rem; opacity: 0; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; text-align: center; transition: opacity 0.5s; }
  #lyr::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 0.05rem;
    background: linear-gradient(90deg, rgba(var(--kr),0), var(--k), rgba(var(--kr),0)); opacity: 0.8; }
  body[data-ly="1"] #lyr { opacity: 1; }
  .lr { height: 0.36rem; white-space: nowrap; }
  .lr span { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: top; }
  #lyP { height: 0.36rem; line-height: 0.36rem; font-size: 0.3rem; font-weight: 600; color: rgba(207,220,236,0.4); }
  #lyCR { height: 0.66rem; }
  #lyC { font-size: 0.5rem; font-weight: 800; line-height: 1.25; height: 0.66rem; color: #fff; }
  #lyC.s1 { font-size: 0.47rem; }
  #lyC.s2 { font-size: 0.44rem; }
  /* karaoke: the sung part is bright, the rest dim; --f is how far the line is (percent of its width) */
  #lyC[data-k="1"] { color: transparent; -webkit-background-clip: text; background-clip: text;
    background-image: linear-gradient(90deg, #fff var(--f, 0%), rgba(255,255,255,0.4) calc(var(--f, 0%) + 3%)); }
  #lyN { height: 0.4rem; line-height: 0.4rem; font-size: 0.34rem; font-weight: 600; color: rgba(207,220,236,0.66); }
  body[data-ly="1"] #now, body[data-ly="1"] #timerCard, body[data-ly="1"] #nextCard { width: 6.35rem; transform: scale(0.85); }
  body[data-ly="1"] #now { transform-origin: 0 0; }
  body[data-ly="1"] #timerCard, body[data-ly="1"] #nextCard { transform-origin: 100% 0; }
  body[data-ly="1"] #nextCard { top: 3.82rem; }
  body[data-ly="1"] #center { transform: scale(0.85); transform-origin: 50% 0; }
  body[data-ly="1"] #panel { top: 7.6rem; height: 2.15rem; }
  .enter { animation: rise 0.55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(0.22rem); } to { opacity: 1; transform: none; } }
  /* motion off or reduced: nothing moves by itself, no transition either */
  .nt *, .nt *::before, .nt *::after { transition: none !important; }
  .calm *, .calm *::before, .calm *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body class="nt" data-mode="wait" data-waiting="{{WAITING}}" data-rpm="{{RPM}}" data-next="{{NEXT}}" data-done="{{DONE}}"
  data-go="{{GO}}" data-rest="{{REST}}" data-paused-word="{{PAUSED}}" data-reconnecting="{{RECONNECTING}}"
  data-left="{{LEFT}}" data-round="{{ROUND}}" data-nice="{{NICE}}" data-total="{{TOTAL}}" data-parts="{{PARTS}}"
  data-in="{{IN}}" data-hint="{{HINT}}" data-keep="{{KEEP}}" data-kinds="{{KINDS}}">
<div id="ambA" class="amb"></div><div id="ambB" class="amb"></div><div id="vignette"></div>
<div id="stage">
  <div id="title" class="abs"><span id="mark"></span><span id="titleText"></span></div>
  <div id="clock" class="abs r d"></div>
  <div id="link" class="abs"></div>

  <div id="now" class="abs r glass">
    <div id="nowTop" class="enter">
      <div id="segment"></div>
      <div id="position"></div>
    </div>
    <div id="pipsBox"><div id="pipsCap" class="cap"></div><div id="pips"></div></div>
    <div id="effort">
      <div id="effortHead"><span id="effortWord"></span><span id="effortNum"></span></div>
      <div id="bars"></div>
    </div>
  </div>

  <div id="timerCard" class="abs r glass">
    <div id="timer"></div>
    <div id="round"></div>
    <div id="segBar"><div id="segFill"></div></div>
    <div id="dots"></div>
  </div>
  <div id="nextCard" class="abs r glass">
    <div id="nextLabel" class="cap"></div>
    <div id="nextName"></div>
    <div id="nextSub"></div>
  </div>

  <div id="lyr" class="abs r glass">
    <div class="lr"><span id="lyP"></span></div>
    <div class="lr" id="lyCR"><span id="lyC"></span></div>
    <div class="lr"><span id="lyN"></span></div>
  </div>

  <div id="phase" class="abs r"><span id="phaseText"></span></div>
  <div id="center" class="abs r">
    <div id="aura"></div>
    <svg id="dial" viewBox="0 0 400 400">
      <circle class="rot" id="track" cx="200" cy="200" r="148" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="24"
        stroke-linecap="round"></circle>
      <g id="ticks2" stroke="rgba(255,255,255,0.3)" stroke-linecap="round"></g>
      <circle class="rot band" id="bandGlow" cx="200" cy="200" r="148" fill="none" stroke-width="34" stroke-linecap="round"
        style="stroke: var(--z); opacity: 0.16"></circle>
      <circle class="rot band" id="band" cx="200" cy="200" r="148" fill="none" stroke-width="24" stroke-linecap="round"
        style="stroke: var(--z)"></circle>
      <circle class="rot halo" id="halo" cx="200" cy="200" r="148" fill="none" stroke-width="26" stroke-linecap="round"
        style="stroke: var(--z)"></circle>
      <g class="rot knobG" id="knob">
        <circle id="knobHalo" cx="348" cy="200" r="27" style="fill: var(--z)" opacity="0.2"></circle>
        <circle cx="348" cy="200" r="17" fill="#fff" stroke-width="7" style="stroke: var(--z)"></circle>
      </g>
    </svg>
    <div id="readout">
      <div id="rpm"></div>
      <div id="unit"></div>
      <div id="range"><span id="rangeText"></span></div>
    </div>

    var calm = reduced || !f.playing || f.paused;
    var sig = ck + "|" + built.sk + "|" + (summits ? 1 : 0) + "|" + (done ? "d" : f.ride.segment_index) + "|" + ni + "|" + Math.floor(seconds) + "|" + pin;
    if (calm ? sig === cv.lastSig : now - cv.lastDraw < COURSE_FRAME_MS) { return; }
    cv.lastSig = sig; cv.lastDraw = now;
    paintCourse({ look: look, summits: summits, ridden: done ? tot : seconds, done: done, nextIx: ni, pin: pin, clock: calm ? null : now / 1000 });
    setA(el.course, "aria-label", document.title + ", " + (f.text && f.text.segment ? f.text.segment + ", " : "") + clock(done ? tot : seconds) + " / " + clock(tot));
  }

  // ---- the song's lyrics: the server sends them once per song; the line is found here from the same position
  // that drives the clock and the beat (the shift of the lyrics against the music comes with them)
  var LYR_GRACE_MS = 3000, LYR_TAIL_MS = 4000, LYR_MS_PER_CHAR = 95, LYR_MIN_FILL_MS = 1500, LYR_PLAIN_MS = 210000;
  var LYR_NOTE = "\u266A", LYR_FIT_STEPS = 2, LYR_FILL_STEP = 0.5;
  var lyr = { on: false, seen: 0, k: "", f: "" };
  // the last line before `idx` (step -1) or the first after it (step 1) that has words, looking two lines away
  function lyrPick(lines, from, step) {
    for (var k = 0; k < 2; k++) {
      var line = lines[from + k * step];
      if (line && line.text) { return line.text; }
    }
    return "";
  }
  // the line being sung: synced lyrics by their times, plain ones spread over the song's length
  function lyrIndex(L, pos) {
    var lines = L.lines, n = lines.length;
    if (!L.synced) { return Math.min(n - 1, Math.floor(clamp(pos / (L.duration_ms > 0 ? L.duration_ms : LYR_PLAIN_MS), 0, 1) * n)); }
    var eff = pos - (L.offset_ms || 0), a = 0, z = n;
    while (a < z) { var mid = (a + z) >> 1; if (lines[mid].t_ms <= eff) { a = mid + 1; } else { z = mid; } }
    return a - 1;
  }
  // `show` is false while something covers the stage (the 3-2-1)
  function lyrics(L, pos, show) {
    var have = !!(L && L.lines && L.lines.length), now = Date.now();
    if (have) { lyr.seen = now; lyr.on = true; } else if (lyr.on && now - lyr.seen > LYR_GRACE_MS) { lyr.on = false; }
    setLy(lyr.on);
    setS(el.lyr, "opacity", lyr.on && show ? "" : "0");
    if (!lyr.on) { return; }
    var idx = -1, lines = have ? L.lines : [], text = "", fill = "";
    if (have) {
      idx = lyrIndex(L, pos);
      text = idx >= 0 ? lines[idx].text : "";
      if (L.synced && text) {
        var eff = pos - (L.offset_ms || 0), t0 = lines[idx].t_ms;
        var gap = idx + 1 < lines.length ? lines[idx + 1].t_ms - t0 : LYR_TAIL_MS;
        var span = Math.max(1, Math.min(gap, Math.max(LYR_MIN_FILL_MS, text.length * LYR_MS_PER_CHAR)));
        fill = (Math.round(clamp((eff - t0) / span, 0, 1) * 100 / LYR_FILL_STEP) * LYR_FILL_STEP) + "%";
      }
    }
    var key = have ? L.song_key + ":" + idx : "-";
    if (key !== lyr.k) {
      lyr.k = key;
      setT(el.lyP, have ? lyrPick(lines, idx - 1, -1) : "");
      setT(el.lyC, text || LYR_NOTE);
      setT(el.lyN, have ? lyrPick(lines, idx + 1, 1) : "");
      fit(el.lyC, LYR_FIT_STEPS);
      restart(el.lyC, "enter");
      restart(el.lyN, "enter");
    }
    setA(el.lyC, "data-k", fill ? "1" : "0");
    if (fill && lyr.f !== fill) { lyr.f = fill; el.lyC.style.setProperty("--f", fill); }
  }
  function setLy(on) {
    var v = on ? "1" : "0";
    if (body.getAttribute("data-ly") !== v) { body.setAttribute("data-ly", v); }
  }

  function setMode(m) {
    if (body.getAttribute("data-mode") !== m) { body.setAttribute("data-mode", m); }
    if (m !== "ride") { lyr.on = false; setLy(false); body.setAttribute("data-paused", "0"); setS(el.count, "display", "none"); setS(el.pausedMsg, "display", "none"); }
  }

  // the 3-2-1 digit showing now, from the cues listed at the sampled position and the time since
  function countdownDigit(ride, pos) {
    var cues = ride.cues || [], gone = pos - ride.pulse.song_position_ms;
    for (var i = 0; i < cues.length; i++) {
      var n = cues[i].kind === "countdown3" ? 3 : cues[i].kind === "countdown2" ? 2 : cues[i].kind === "countdown1" ? 1 : 0;
      var due = cues[i].in_ms - gone;
      if (n && due <= 0 && due > -1000) { return n; }
    }
    return 0;
  }

  var lastPart = "", dotsKey = "";
  function summary(f) {
    var ride = f.ride, parts = f.parts || [], i, sums = {}, order = [], totalS = 0;
    setT($("statTime"), mmss(ride.total_s * 1000));
    setT($("statParts"), String(ride.segment_count));
    for (i = 0; i < parts.length; i++) {
      if (!sums[parts[i].kind]) { sums[parts[i].kind] = 0; order.push(parts[i].kind); }
      sums[parts[i].kind] += parts[i].seconds; totalS += parts[i].seconds;
    }
    var mix = "", legend = "";
    order.sort(function (a, c) { return sums[c] - sums[a]; });
    for (i = 0; i < order.length; i++) {
      var hex = COLORS[order[i]] || FALLBACK;
      mix += '<i style="width:' + (sums[order[i]] / Math.max(1, totalS) * 100).toFixed(2) + "%;background:" + hex + '"></i>';
      if (i < 6) { legend += '<span><i style="background:' + hex + '"></i>' + (KIND_NAMES[order[i]] || "") + " " + mmss(sums[order[i]] * 1000) + "</span>"; }
    }
    setH($("mix"), mix); setH($("legend"), legend);
  }

  function render() {
    if (!frame || !frame.ride) { tint(FALLBACK, FALLBACK); setMode("wait"); return; }
    var ride = frame.ride;
    if (body.className === "nt") { setTimeout(function () { body.className = ""; }, 120); }
    if (ride.finished) {
      tint("#3ddc97", "#3ddc97");
      setMode("done");
      summary(frame);
      setT(el.clock, "");
      drawCourse(frame, ride.total_s, true, -1);
      return;
    }
    setMode("ride");
    var color = COLORS[ride.kind] || FALLBACK, iv = ride.interval;
    var zone = iv ? (iv.phase === "work" ? WORK : REST) : color;
    tint(color, zone);
    // a new part: what is on the left rises in again
    var partKey = ride.segment_index + ":" + ride.kind;
    if (partKey !== lastPart) { if (lastPart) { restart(el.nowTop, "enter"); } lastPart = partKey; }

    // where we are in the ride: "3 / 12 parts" and one pip per part in its colour
    setT(el.pipsCap, (ride.segment_index + 1) + " / " + ride.segment_count + " " + word("parts"));
    var pk = ride.segment_count + ":" + (frame.parts ? frame.parts.length : 0);
    if (pk !== el.pips._k) {
      el.pips._k = pk; el.pips._c = -1;
      var ph = "", pp = frame.parts || [];
      for (var q = 0; q < pp.length; q++) { ph += '<i style="--p:' + (COLORS[pp[q].kind] || FALLBACK) + '"></i>'; }
      el.pips.innerHTML = ph;
    }
    if (el.pips._c !== ride.segment_index) {
      el.pips._c = ride.segment_index;
      for (q = 0; q < el.pips.childNodes.length; q++) { el.pips.childNodes[q].className = q < ride.segment_index ? "done" : q === ride.segment_index ? "cur" : ""; }
    }
    var name = frame.text.segment || "";
    setT(el.segment, name);
    if (el.segment._f !== name) { el.segment._f = name; fit(el.segment, 3); }
    var alternating = ride.position.kind === "alternating", standing = ride.position.kind !== "seated";
    setH(el.position, (standing ? STANDING_ICON : SEATED_ICON) + "<span></span>");
    el.position.lastChild.textContent = alternating ? word("hint") : frame.text.position;
    setS(el.position, "color", standing ? "#ffc58a" : "#cfe3ff");

    var rpm = String(ride.target_rpm);
    setT(el.rpm, rpm);
    el.rpm.className = rpm.length >= 3 ? "three" : "";
    var same = ride.range.min_rpm === ride.range.max_rpm;
    setT(el.rangeText, same ? "" : ride.range.min_rpm + "–" + ride.range.max_rpm);
    setS(el.range, "display", same ? "none" : "block");
    gauge(ride);
    setT(el.phaseText, iv ? (iv.phase === "work" ? word("go") + "!" : word("rest")) : "");
    setS(el.phase, "display", iv ? "block" : "none");

    // effort: "Hard 7" -> the word and the number, ten rising bars
    var eff = frame.text.effort || "", cut = eff.lastIndexOf(" ");
    setT(el.effortWord, cut > 0 ? eff.slice(0, cut) : eff);
    setH(el.effortNum, ride.effort + "<small>/10</small>");
    for (var i = 0; i < bars.length; i++) { setS(bars[i], "background", i < ride.effort ? color : ""); }

    // the clock of this part (the phase inside an interval) and how far through it we are
    var pos = position(), gone = pos - ride.pulse.song_position_ms;
    var segMs = Math.max(1, ride.segment_seconds * 1000), segLeft = segMs - pos;
    var shown = iv ? Math.min(segLeft, iv.phase_remaining_s * 1000 - gone) : segLeft;
    setT(el.timer, mmss(shown));
    setT(el.round, iv ? word("round") + " " + iv.round + " / " + iv.rounds : word("left"));
    setS(el.segBar, "display", iv ? "none" : "block");
    setS(el.dots, "display", iv ? "flex" : "none");
    setS(el.segFill, "width", clamp(100 - segLeft / segMs * 100, 0, 100).toFixed(1) + "%");
    if (iv) {
      var dk = String(iv.rounds);
      if (dk !== dotsKey) { dotsKey = dk; var h = ""; for (var r = 0; r < iv.rounds; r++) { h += "<i></i>"; } el.dots.innerHTML = h; el.dots._d = ""; }
      var state = String(iv.round);
      if (el.dots._d !== state) {
        el.dots._d = state;
        for (r = 0; r < el.dots.childNodes.length; r++) { el.dots.childNodes[r].className = r + 1 < iv.round ? "done" : r + 1 === iv.round ? "cur" : ""; }
      }
    }
    var elapsedMs = ride.elapsed_s * 1000 + gone, totalMs = Math.max(1, ride.total_s * 1000);
    el.clock.innerHTML = "<b>" + mmss(Math.min(elapsedMs, totalMs)) + "</b>&nbsp;/&nbsp;" + mmss(totalMs);

    // next: the first part of a different kind, or "keep going" when this kind runs to the end
    var ni = nextDifferent(frame), np = ni >= 0 ? frame.parts[ni] : null;
    var nc = np ? COLORS[np.kind] || FALLBACK : color;
    if (el.nextCard._n !== nc) { el.nextCard._n = nc; el.nextCard.style.setProperty("--n", nc); el.nextCard.style.setProperty("--nr", rgb(nc)); body.style.setProperty("--n", nc); }
    if (np) {
      var nn = KIND_NAMES[np.kind] || "", immediate = ni === ride.segment_index + 1 && ride.next;
      setT(el.nextName, nn);
      var sub = word("in") + " " + mmss(np.start_s * 1000 - elapsedMs);
      setT(el.nextSub, immediate ? ride.next.target_rpm + " " + word("rpm") + "  ·  " + sub : sub);
      if (el.nextName._f !== nn) { el.nextName._f = nn; fit(el.nextName, 2); }
    } else {
      setT(el.nextName, word("keep"));
      if (el.nextName._f !== "keep") { el.nextName._f = "keep"; fit(el.nextName, 2); }
      setT(el.nextSub, "");
    }
    el.nextName.style.color = "";
    var soon = !!(np && ni === ride.segment_index + 1 && ride.notice);
    var cls = "abs r glass" + (soon ? " soon" : "");
    if (el.nextCard.className !== cls) { el.nextCard.className = cls; }
    drawCourse(frame, elapsedMs / 1000, false, ni);

    // paused: dimmed ride and a word; counting down: dim overlay with the digit and what comes next
    var paused = !!(frame.paused || !frame.playing);
    body.setAttribute("data-paused", paused ? "1" : "0");
    setS(el.pausedMsg, "display", paused ? "flex" : "none");
    var digit = paused ? 0 : countdownDigit(ride, pos);
    lyrics(frame.lyrics, pos, !digit);
    if (digit && ride.next) {
      var cc = COLORS[ride.next.kind] || "#fff";
      if (el.count._d !== digit) {
        el.count._d = digit;
        el.count.style.setProperty("--c", cc); el.count.style.setProperty("--cr", rgb(cc));
        el.countDigit.textContent = String(digit);
        restart(el.countDigit, "digit");
      }
      el.countDigit.style.animation = reduced ? "none" : "";
      var np2 = (frame.text.next || "").split(" · ");
      setT(el.countName, np2[0]);
      setT(el.countRpm, np2.slice(1).join(" · "));
      setS(el.count, "display", "block");
    } else {
      el.count._d = 0;
      setS(el.count, "display", "none");
    }
  }

  // ---- the beat, computed from the grid and the position at display rate; three looks, calm with motion off
  var lastDot = -1, dotSide = 0;
  function beat() {
    var ride = frame && frame.ride;
    var running = ride && !ride.finished && ride.pulse.stroke_ms > 0 && frame.playing;
    var style = (frame && frame.pulse_style) || "ring";
    setS(el.pbar, "display", style === "bar" ? "block" : "none");
    if (running) {
      var p = ride.pulse, raw = (position() + shiftMs - p.first_beat_ms) / p.stroke_ms;
      var phase = ((raw % 1) + 1) % 1, strokeIndex = Math.floor(raw);
      var hit = Math.exp(-phase * 6);
      if (reduced) {
        // no scaling or glow: the target knob's halo steps between two brightnesses, at most MAX_DOT_PER_S times a second
        var every = Math.max(1, Math.ceil(1000 / MAX_DOT_PER_S / p.stroke_ms));
        if (strokeIndex !== lastDot && strokeIndex % every === 0) { lastDot = strokeIndex; dotSide = 1 - dotSide; }
        setA(el.knobHalo, "opacity", dotSide ? "0.75" : "0.2");
        setS(el.rpm, "transform", "none"); setS(el.aura, "opacity", "0"); setS(el.halo, "opacity", "0"); setS(el.flash, "opacity", "0");
      } else if (style === "bar") {
        setS(el.pbarFill, "width", (hit * 100).toFixed(1) + "%");
        setS(el.rpm, "transform", "none"); setS(el.aura, "opacity", "0"); setS(el.halo, "opacity", "0");
      } else if (style === "flash") {
        // at most MAX_FLASH_PER_S, and never brighter than FLASH_ALPHA
        var skip = Math.max(1, Math.ceil(1000 / MAX_FLASH_PER_S / p.stroke_ms));
        var lit = strokeIndex % skip === 0;
        setS(el.flash, "background", body._z || "#fff");
        setS(el.flash, "opacity", lit ? (FLASH_ALPHA * hit).toFixed(3) : "0");
        setS(el.rpm, "transform", "none"); setS(el.aura, "opacity", "0"); setS(el.halo, "opacity", "0");
      } else {
        el.rpm.style.transform = "scale(" + (1 + 0.04 * hit).toFixed(3) + ")";
        el.aura.style.opacity = (0.85 * hit).toFixed(3);
        el.halo.style.opacity = (0.4 * hit).toFixed(3);
        el.halo.style.transform = "rotate(135deg) scale(" + (1 + 0.03 * hit).toFixed(3) + ")";
        setS(el.flash, "opacity", "0");
      }
    } else {
      setS(el.rpm, "transform", "none"); setS(el.aura, "opacity", "0"); setS(el.halo, "opacity", "0"); setS(el.flash, "opacity", "0");
      setA(el.knobHalo, "opacity", "0.2");
    }
    var silent = Date.now() - (received || started) > STALE_MS;
    setS(el.link, "background", silent ? "#8f2f2f" : "#2f8f4e");
    setS(el.reconnect, "display", silent ? "flex" : "none");
    render();
    (window.requestAnimationFrame || function (f) { return setTimeout(f, 33); })(beat);
  }
  function poll() {
    var sent = Date.now(), xhr = new XMLHttpRequest();
    xhr.open("GET", "/ride.json?t=" + sent, true);
    xhr.timeout = 3000;
    xhr.onload = function () {
      var back = Date.now();
      try {
        var json = JSON.parse(xhr.responseText);
        offset = json.server_now_ms - (sent + back) / 2;
        frame = json;
        received = back;
      } catch (e) { /* keep the last frame */ }
    };
    xhr.onloadend = function () { setTimeout(poll, POLL_MS); };
    xhr.send();
  }
  try { if (navigator.wakeLock) { navigator.wakeLock.request("screen"); } } catch (e) { /* optional */ }
  poll();
  beat();
})();
</script>
</body>
</html>
