# Builds every installer on each push to main (kept as workflow artifacts) and,
# for a tag `vX.Y.Z` (created with `cargo xtask bump`), publishes a GitHub Release.
#
# - Desktop app: macOS (Apple Silicon, Intel) .dmg; Windows (x64, ARM64) setup .exe (+ .msi on x64);
#   Linux (x86_64, arm64) .deb, .rpm and .AppImage
# - CLI archives for the same platforms
# - Android APK (arm64-v8a, armeabi-v7a, x86_64)
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version (tag must match Cargo.toml)
        run: |
          version=$(sed -n '/\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v$version" ]]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version"
              exit 1
            fi
            label="$version"
          else
            # builds from main: 0.1.0-main.42
            label="$version-main.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "### HomeFi $label (${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest, target: aarch64-apple-darwin, bundles: dmg }
          - { name: macOS x64, os: macos-latest, target: x86_64-apple-darwin, bundles: dmg }
          - { name: Windows x64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
          # WiX (MSI) can't target ARM64: setup .exe only
          - { name: Windows arm64, os: windows-latest, target: aarch64-pc-windows-msvc, bundles: nsis }
          - { name: Linux x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: "deb,rpm,appimage" }
          - { name: Linux arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: "deb,rpm,appimage" }
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libssl-dev xdg-utils file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      # ring needs clang to cross-compile for Windows on ARM (LLVM ships with the runner image)
      - name: clang for ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # Optional Developer ID signing / notarization (see docs/releasing.md). Without it the
      # app is ad-hoc signed (`signingIdentity: "-"` in tauri.conf.json): Apple Silicon refuses
      # to start apps with no signature at all, ad-hoc only needs a one-time "Open Anyway".
      - name: macOS signing (optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE" ]]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -n "${!v}" ]]; then
                echo "::add-mask::${!v}"
                { echo "$v<<EOF"; echo "${!v}"; echo "EOF"; } >> "$GITHUB_ENV"
              fi
            done
          else
            echo "No Apple certificate: the app is ad-hoc signed (opens after \"Open Anyway\", see docs/releasing.md)"
          fi

      - name: Build
        working-directory: apps/desktop
        shell: bash
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect installers
        shell: bash
        run: |
          label="${{ needs.version.outputs.label }}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) plat=macos; arch=arm64 ;;
            x86_64-apple-darwin) plat=macos; arch=x64 ;;
            x86_64-pc-windows-msvc) plat=windows; arch=x64 ;;
            aarch64-pc-windows-msvc) plat=windows; arch=arm64 ;;
            x86_64-unknown-linux-gnu) plat=linux; arch=x86_64 ;;
            aarch64-unknown-linux-gnu) plat=linux; arch=arm64 ;;
          esac
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p pkg
          shopt -s nullglob
          for f in "$bundle"/dmg/*.dmg "$bundle"/nsis/*.exe "$bundle"/msi/*.msi \
                   "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage; do
            ext="${f##*.}"
            [[ "$f" == */nsis/* ]] && ext="setup.exe"
            /bin/cp "$f" "pkg/HomeFi-$label-$plat-$arch.$ext"
          done
          ls -la pkg
          [[ -n "$(ls pkg)" ]] || { echo "::error::no installers were produced"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: pkg/*
          retention-days: ${{ github.ref_type == 'tag' && 90 || 30 }}
          if-no-files-found: error

  cli:
    name: CLI ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: clang for ARM64
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release --locked -p homefi-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="homefi-cli-${{ needs.version.outputs.label }}-${{ matrix.target }}"
          mkdir -p "pkg/$name"
          bin="target/${{ matrix.target }}/release/homefi"
          [[ "${{ runner.os }}" == "Windows" ]] && bin="$bin.exe"
          /bin/cp "$bin" README.md LICENSE NOTICE docs/config.example.toml "pkg/$name/"
          cd pkg
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: pkg/*.*z*
          retention-days: ${{ github.ref_type == 'tag' && 90 || 30 }}

  # Android APK, signed with the ANDROID_* secrets (see docs/releasing.md). The SR35 build
  # (`com.spotify.music` id) is never published: it's made by hand for that player only.
  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # the default package list asks for "tools", which newer SDK command-line tools no longer have
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;29.0.14206865"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/homefi.jks"
            echo "HOMEFI_KEYSTORE_FILE=$RUNNER_TEMP/homefi.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # a published APK signed with a throwaway key couldn't be updated later
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: a release APK must carry the release key"
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APK is signed with the debug key"
          fi
      - name: Build
        working-directory: apps/android
        env:
          HOMEFI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HOMEFI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HOMEFI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - run: |
          mkdir -p pkg
          /bin/cp apps/android/app/build/outputs/apk/release/homefi-*-release.apk \
            "pkg/HomeFi-${{ needs.version.outputs.label }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: pkg/*.apk
          retention-days: ${{ github.ref_type == 'tag' && 90 || 30 }}

  # One bundle with everything + checksums; on a tag, also the GitHub Release.
  # With the R2 secrets set, everything is also uploaded to Cloudflare R2 (see docs/releasing.md).
  collect:
    needs: [version, desktop, cli, android]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true
      # the same files without the version, so README links to releases/latest/download/<name> never break
      - name: Stable names
        env:
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          for f in pkg/*-"$LABEL"-*; do
            /bin/cp "$f" "${f/-$LABEL-/-}"
          done
          ls pkg
      - name: Checksums
        run: |
          cd pkg && sha256sum * > SHA256SUMS && cd ..
          {
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in pkg/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeFi-${{ needs.version.outputs.label }}
          path: pkg/*
          retention-days: ${{ github.ref_type == 'tag' && 90 || 30 }}

      # Layout in the bucket:
      #   releases/<version>/...   every tag          latest/...       last stable tag
      #   main/<label>/...         every push to main main/latest/...  last build of main
      # Each folder has a manifest.json (files, sizes, sha256 and URLs when R2_PUBLIC_URL is set).
      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          AWS_DEFAULT_REGION: auto
          # R2 doesn't accept the newer default checksum headers of the AWS CLI
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VERSION: ${{ needs.version.outputs.version }}
          LABEL: ${{ needs.version.outputs.label }}
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$R2_BUCKET" ]]; then
            echo "R2 is not configured (secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, variable R2_BUCKET): skipped"
            exit 0
          fi
          endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            dir="releases/$VERSION"
            # pre-releases (1.2.0-beta.1) don't replace latest/
            [[ "$VERSION" == *-* ]] && latest="" || latest="latest"
          else
            dir="main/$LABEL"
            latest="main/latest"
          fi

          manifest() { # $1 = folder in the bucket
            python3 - "$1" <<'PY'
          import hashlib, json, os, sys, datetime
          folder = sys.argv[1]
          base = os.environ.get("R2_PUBLIC_URL", "").rstrip("/")
          files = []
          for name in sorted(os.listdir("pkg")):
              path = os.path.join("pkg", name)
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              entry = {"name": name, "size": os.path.getsize(path), "sha256": digest}
              if base:
                  entry["url"] = f"{base}/{folder}/{name}"
              files.append(entry)
          json.dump({
              "version": os.environ["VERSION"],
              "label": os.environ["LABEL"],
              "commit": os.environ["GITHUB_SHA"],
              "date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "files": files,
          }, open("manifest.json", "w"), indent=2)
          PY
          }

          manifest "$dir"
          aws s3 cp pkg "s3://$R2_BUCKET/$dir/" --recursive --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp manifest.json "s3://$R2_BUCKET/$dir/manifest.json" --endpoint-url "$endpoint" --content-type application/json --only-show-errors
          if [[ -n "$latest" ]]; then
            manifest "$latest"
            aws s3 sync pkg "s3://$R2_BUCKET/$latest/" --delete --endpoint-url "$endpoint" --only-show-errors
            aws s3 cp manifest.json "s3://$R2_BUCKET/$latest/manifest.json" --endpoint-url "$endpoint" --content-type application/json --only-show-errors
          fi
          echo "Uploaded to r2://$R2_BUCKET/$dir${latest:+ and $latest}" >> "$GITHUB_STEP_SUMMARY"
      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Personal, non-commercial use only.** HomeFi is not affiliated with or endorsed by TIDAL and
          requires your own paid TIDAL subscription. Don't share, sell, upload or distribute what you
          download; you are responsible for complying with TIDAL's terms and your country's copyright
          laws. See the [README](https://github.com/joseespana/homefi#readme) for the full notice.
          EOF
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag' && needs.desktop.result == 'success' && needs.android.result == 'success'
        with:
          name: HomeFi ${{ needs.version.outputs.version }}
          body_path: notes.md
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: pkg/*
